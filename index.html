<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salary Manager</title>
<meta name="description" content="Monthly salary plan, withdrawals and savings. Works offline; data stays on this phone.">
<meta name="theme-color" content="#0c6a56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salary">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/bricolage-500.woff2") format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/bricolage-700.woff2") format("woff2")}
@font-face{font-family:"Public Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/public-400.woff2") format("woff2")}
@font-face{font-family:"Public Sans";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/public-500.woff2") format("woff2")}
@font-face{font-family:"Public Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/public-600.woff2") format("woff2")}
@font-face{font-family:"Public Sans";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/public-700.woff2") format("woff2")}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}

<style>
/* Layout: phone-first single column (max 620px), sticky month header, fixed bottom tabs.
Rows read like a bank passbook. Red = withdrawn (the original sheet's convention),
amber = envelope taken in parts, green = savings. */
:root{
--bg:#f2f5f3; --surface:#ffffff; --sunk:#e8eeeb; --ink:#13201b; --muted:#5a6a64; --line:#d8e1dd;
--accent:#0c6a56; --accent-ink:#ffffff; --accent-soft:#dcefe8;
--paid:#c0372d; --paid-soft:#fae6e3;
--env:#a86300; --env-soft:#fbeed8;
--save:#1d8248; --save-soft:#e0f2e7;
--warn:#9a4b00; --warn-soft:#fdf0dd;
--shadow:0 1px 2px rgba(19,32,27,.06),0 4px 14px rgba(19,32,27,.06);
--font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
--font-body:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
--r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
--bg:#0e1412; --surface:#161f1c; --sunk:#1c2723; --ink:#e6eeea; --muted:#97a8a1; --line:#283530;
--accent:#4cc4a3; --accent-ink:#062219; --accent-soft:#143a30;
--paid:#ff8076; --paid-soft:#3b1c1a;
--env:#f1aa45; --env-soft:#3a2a12;
--save:#62d290; --save-soft:#163524;
--warn:#f1aa45; --warn-soft:#3a2a12;
--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
color-scheme:dark;
}}
:root[data-theme="dark"]{
--bg:#0e1412; --surface:#161f1c; --sunk:#1c2723; --ink:#e6eeea; --muted:#97a8a1; --line:#283530;
--accent:#4cc4a3; --accent-ink:#062219; --accent-soft:#143a30;
--paid:#ff8076; --paid-soft:#3b1c1a;
--env:#f1aa45; --env-soft:#3a2a12;
--save:#62d290; --save-soft:#163524;
--warn:#f1aa45; --warn-soft:#3a2a12;
--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.top h1{font-size:22px;font-weight:700}
.top .sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.pill.env{background:var(--env-soft);color:var(--env)}
.pill.save{background:var(--save-soft);color:var(--save)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
main.wrap{padding-block:16px 24px;display:flex;flex-direction:column;gap:20px}
section.view{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.summary{padding:16px;display:flex;flex-direction:column;gap:14px}
.big-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--font-display);font-size:36px;font-weight:700;line-height:1.05}
.big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:10px;padding:10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-weight:700;font-size:16px}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.bar > i{display:block;height:100%}
.bar .b-paid{background:var(--paid)}
.bar .b-env{background:var(--env)}
.bar .b-save{background:var(--save)}
.bar .b-over{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.alert{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-head .meta{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .note{font-size:12px;color:var(--muted)}
.row .amt{text-align:right;font-weight:600;white-space:nowrap}
.row .amt .of{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.row .bar{grid-column:1 / -1;height:6px}
.row .actions{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.row.done .name{color:var(--muted)}
.tags{display:inline-flex;gap:6px;margin-left:6px;vertical-align:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.paid{background:var(--paid);border-color:var(--paid);color:#fff}
.btn.save{background:var(--save);border-color:var(--save);color:#fff}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:13px}
.btn.danger{color:var(--paid)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.log .row{grid-template-columns:minmax(0,1fr) auto auto}
.log .when{font-size:12px;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px;min-height:34px}
.x.armed{background:var(--paid-soft);color:var(--paid);font-weight:600}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{color:var(--ink)}
/* charts */
.chart{padding:14px 10px 6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-body);font-size:19px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--save);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--save);fill-opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--save);stroke-width:2}
.chart .dot.end{fill:var(--save)}
.chart .lbl{fill:var(--ink);font-weight:600}
.chart .bars rect{fill:var(--save)}
.chart .bars rect.cur{fill:var(--accent)}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.hist th:first-child,.hist td:first-child{text-align:left}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist tr:last-child td{border-bottom:0}
.hist tr.clickable{cursor:pointer}
.hist tr.clickable:hover td{background:var(--sunk)}
.scroll{overflow-x:auto}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px;border-radius:10px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* sheet */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:20px}
.sheet .hint{color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.input.big-in{font-size:24px;font-weight:700;font-family:var(--font-display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.err{color:var(--paid);font-size:13px;font-weight:600}
.err:empty{display:none}
.plan-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-row .wide{grid-column:1 / -1;display:flex;gap:8px;align-items:center}
.plan-row select{flex:1;min-width:0}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.radio input{margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:30px}}
</style>

<body>
<header class="top"><div class="wrap">
<div style="min-width:0">
<h1 id="hdr-title">Salary Manager</h1>

</div>
<span id="hdr-pill"></span>
</div></header>
<main class="wrap" id="app">
<section class="view" id="v-month"><div class="loading">Loading your months…</div></section>
<section class="view" id="v-savings" hidden></section>
<section class="view" id="v-history" hidden></section>
</main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
<a href="#month" data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</a>
<a href="#savings" data-tab="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Savings</a>
<a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</a>
</div></nav>

<div class="toast" id="toast" hidden></div>
<script>
/* On-phone database: same shape as the online one (doc / collection / onSnapshot / add / set / delete),
kept in this browser's storage so the app works with no signal. */
const LocalDB = (function(){
const KEY = "salary-manager-data-v1";
const load = ()=>{ try{ const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" ? v : {}; }catch(e){ return {}; } };
let STORE = load();
const listeners = new Set();
const copy = (o)=>JSON.parse(JSON.stringify(o));
const persist = ()=>localStorage.setItem(KEY, JSON.stringify(STORE));
const notify = ()=>setTimeout(()=>listeners.forEach(l=>{ try{ l.fire(); }catch(e){ console.error(e); } }),0);
const snapDoc = (p)=>({ id:p.split("/").pop(), exists: Object.prototype.hasOwnProperty.call(STORE,p), data:()=> Object.prototype.hasOwnProperty.call(STORE,p) ? copy(STORE[p]) : undefined, metadata:{fromCache:false,hasPendingWrites:false} });
const snapCol = (c)=>{ const n=c.split("/").length+1; const docs=Object.keys(STORE).filter(p=>p.startsWith(c+"/")&&p.split("/").length===n).sort().map(snapDoc); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}; };
function put(p, d){
const had = Object.prototype.hasOwnProperty.call(STORE,p), prev = STORE[p];
if(d===undefined) delete STORE[p]; else STORE[p]=copy(d);
try{ persist(); }
catch(e){ if(had) STORE[p]=prev; else delete STORE[p]; throw {code:"quota_exceeded", message:"Phone storage is full"}; }
notify();
}
const genId = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const docRef = (p)=>({ id:p.split("/").pop(), path:p,
get: async()=>snapDoc(p),
set: async(d)=>put(p,d),
update: async(d)=>{ if(!(p in STORE)) throw {code:"invalid_argument"}; put(p,Object.assign(copy(STORE[p]),d)); },
delete: async()=>put(p,undefined),
onSnapshot(cb){ const l={fire:()=>cb(snapDoc(p))}; listeners.add(l); setTimeout(l.fire,0); return ()=>listeners.delete(l); },
collection:(c)=>colRef(p+"/"+c) });
const colRef = (c)=>({ path:c,
doc:(id)=>docRef(c+"/"+(id||genId())),
add: async(d)=>{ const r=docRef(c+"/"+genId()); await r.set(d); return r; },
onSnapshot(cb){ const l={fire:()=>cb(snapCol(c))}; listeners.add(l); setTimeout(l.fire,0); return ()=>listeners.delete(l); } });
// another tab of the app changed the data
window.addEventListener("storage", e=>{ if(e.key===KEY){ STORE=load(); notify(); } });
return {
doc: docRef, collection: colRef,
dump: ()=>copy(STORE),
replaceAll(data){ const prev=STORE; STORE=copy(data); try{ persist(); }catch(e){ STORE=prev; throw {code:"quota_exceeded"}; } notify(); },
isEmpty: ()=>Object.keys(STORE).length===0
};
})();
/* Hand a file to the person: share sheet on phones (Save to Files / Drive / WhatsApp), download elsewhere. */
async function saveFile(name, text, mime){
const blob = new Blob([text], {type:mime});
try{
const f = new File([blob], name, {type:mime});
if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return "shared"; }
}catch(e){ if(e && e.name==="AbortError") return "cancelled"; }
const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
return "downloaded";
}
</script>
<script>
(function(){
"use strict";
const CUR = "DH";
const S = { db:null, dl:null, months:{}, withdrawals:[], savings:[], settings:null,
ready:{m:false,w:false,s:false,t:false}, tab:"month", viewKey:null, failed:false };
/* ---------- helpers ---------- */
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n)=>{ const v=Math.round((Number(n)||0)*100)/100; return v.toLocaleString("en-US",{maximumFractionDigits:2}); };
const money = (n)=>fmt(n)+" "+CUR;
const num = (v)=>{ const n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:NaN; };
const uid = ()=>Math.random().toString(36).slice(2,10);
const sum = (arr,f)=>arr.reduce((a,x)=>a+(f?f(x):x),0);
function monthLabel(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleString("en-GB",{month:"long",year:"numeric"}); }
function monthShort(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleString("en-GB",{month:"short"}); }
function addMonths(key,n){ const [y,m]=key.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function whenText(iso){ if(!iso) return "Date not recorded"; const d=new Date(iso); return d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
function localNow(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function sortedKeys(){ return Object.keys(S.months).sort(); }
function currentKey(){ const k=S.settings&&S.settings.currentMonth; if(k&&S.months[k]) return k; const ks=sortedKeys(); return ks[ks.length-1]||null; }
let toastT=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
/* ---------- money maths (one place) ---------- */
function calc(key){
const m=S.months[key]; if(!m) return null;
const charges=m.charges||[];
const W=S.withdrawals.filter(w=>w.month===key);
const SV=S.savings.filter(e=>e.month===key);
const incomeSum=sum(m.income||[],i=>Number(i.amount)||0);
const fromSavings=-sum(SV.filter(e=>e.kind==="withdraw"),e=>Number(e.amount)||0);
const available=(Number(m.salary)||0)+incomeSum+fromSavings;
const planned=sum(charges,c=>Number(c.planned)||0);
const rows=charges.map(c=>{
let taken;
if(m.imported) taken=Number(c.planned)||0;
else if(c.type==="savings") taken=sum(SV.filter(e=>e.kind==="deposit"&&e.chargeId===c.id),e=>Number(e.amount)||0);
else taken=sum(W.filter(w=>w.chargeId===c.id),w=>Number(w.amount)||0);
const p=Number(c.planned)||0;
return {...c, planned:p, taken, left:Math.max(p-taken,0), over:Math.max(taken-p,0), done: p>0 ? taken>=p : taken>0};
});
const unplanned=W.filter(w=>!w.chargeId||!charges.some(c=>c.id===w.chargeId));
const unplannedSum=sum(unplanned,w=>Number(w.amount)||0);
const savedDeposits=sum(SV.filter(e=>e.kind==="deposit"),e=>Number(e.amount)||0);
// manual "Add to savings" from this month's money also leaves the bank; leftovers carried from last month do not
const looseDeposits=m.imported?0:sum(SV.filter(e=>e.kind==="deposit"&&!e.fromLeftover&&!charges.some(c=>c.id===e.chargeId&&c.type==="savings")),e=>Number(e.amount)||0);
const takenTotal=sum(rows,r=>r.taken)+unplannedSum+looseDeposits;
const leftToTake=sum(rows,r=>r.left);
return { m, rows, W, SV, incomeSum, fromSavings, available, planned, unplanned, unplannedSum,
takenTotal, leftToTake, inBank: available-takenTotal, overPlan: planned-available, spare: available-planned-unplannedSum,
saved: savedDeposits };
}
function savingsBalance(uptoKey){ return sum(S.savings.filter(e=>!uptoKey||e.month<=uptoKey),e=>Number(e.amount)||0); }
/* ---------- database ---------- */
async function boot(){
bindTabs(); route();
S.db = LocalDB; S.dl = true;
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
const db = S.db;
const err=(e)=>{ console.error(e); toast("Couldn't read the data on this phone."); };
db.collection("months").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{o[d.id]=d.data();}); S.months=o; S.ready.m=true; render(); }, err);
db.collection("withdrawals").onSnapshot(snap=>{ S.withdrawals=snap.docs.map(d=>({id:d.id,...d.data()})); S.ready.w=true; render(); }, err);
db.collection("savings").onSnapshot(snap=>{ S.savings=snap.docs.map(d=>({id:d.id,...d.data()})); S.ready.s=true; render(); }, err);
db.doc("settings/app").onSnapshot(snap=>{ S.settings=snap.exists?snap.data():null; S.ready.t=true; render(); }, err);
if("serviceWorker" in navigator && location.protocol!=="file:"){
navigator.serviceWorker.register("sw.js").catch(e=>console.warn("offline cache not installed", e));
}
}
async function write(fn, okMsg){
try{ await fn(); if(okMsg) toast(okMsg); return true; }
catch(e){ console.error(e); toast(e&&e.code==="quota_exceeded" ? "Storage is full. Export to CSV and remove old entries." : "Not saved. Check your connection and try again."); return false; }
}

/* ---------- charts ---------- */
function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*p; }
function lineChart(pts){
const W=600,H=260,L=62,R=24,T=36,B=40; const max=niceMax(Math.max(...pts.map(p=>p.value),1));
const x=i=>pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1); const y=v=>T+(H-T-B)*(1-v/max);
let g=""; for(let i=0;i<=4;i++){const v=max*i/4; g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtK(v)+'</text>';}
const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.value).toFixed(1)).join(" ");
const area=d+" L"+x(pts.length-1).toFixed(1)+" "+y(0)+" L"+x(0).toFixed(1)+" "+y(0)+" Z";
const dots=pts.map((p,i)=>'<circle class="dot'+(i===pts.length-1?" end":"")+'" cx="'+x(i)+'" cy="'+y(p.value)+'" r="'+(i===pts.length-1?5:3.5)+'"/><text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(p.label)+'</text>').join("");
const last=pts[pts.length-1]; const lx=x(pts.length-1);
const lbl='<text class="lbl" x="'+Math.min(lx,W-R)+'" y="'+(y(last.value)-12)+'" text-anchor="end">'+fmt(last.value)+'</text>';
return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Savings balance by month">'+g+'<path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'+dots+lbl+'</svg>';
}
function barChart(pts){
const W=600,H=270,L=62,R=12,T=34,B=64; const max=niceMax(Math.max(...pts.map(p=>p.value),1));
const slot=(W-L-R)/pts.length; const bw=Math.min(46,slot*.6); const y=v=>T+(H-T-B)*(1-v/max);
let g=""; for(let i=0;i<=4;i++){const v=max*i/4; g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtK(v)+'</text>';}
const bars=pts.map((p,i)=>{const cx=L+slot*i+slot/2; const top=y(Math.max(p.value,0)); return '<rect class="'+(p.cur?"cur":"")+'" x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+Math.max(y(0)-top,0)+'" rx="3"/>'+
'<text class="lbl" x="'+cx+'" y="'+(top-8)+'" text-anchor="middle">'+fmtK(p.value)+'</text><text x="'+cx+'" y="'+(H-36)+'" text-anchor="middle">'+esc(p.label)+'</text><text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.sub)+'</text>';}).join("");
return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Amount saved each month"><g>'+g+'</g><g class="bars">'+bars+'</g></svg>';
}
function fmtK(v){ return v>=1000?(Math.round(v/100)/10)+"k":String(Math.round(v)); }
/* ---------- actions ---------- */
function bind(root){
root.querySelectorAll("[data-act]").forEach(b=>{
b.addEventListener("click",()=>act(b.dataset.act,b.dataset.id,b));

function act(a,id,btn){
const k=S.viewKey;
if(a==="withdraw") return sheetWithdraw(k,id);
if(a==="unplanned") return sheetUnplanned(k);
if(a==="income") return sheetIncome(k);
if(a==="edit-plan") return sheetPlan(k);
if(a==="new-month") return sheetNewMonth();
if(a==="sav-in") return sheetSavings("in");
if(a==="sav-out") return sheetSavings("out");
if(a==="go-current"){ S.viewKey=currentKey(); render(); return; }
if(a==="open-month"){ S.viewKey=id; location.hash="#month"; route(); window.scrollTo(0,0); return; }
if(a==="export") return exportCsv();
if(a==="backup") return exportBackup();
if(a==="import") return sheetImport();
if(a==="del-entry"||a==="del-income") return armDelete(btn, async()=>{
if(a==="del-income"){ const m=clone(S.months[k]); m.income=(m.income||[]).filter(i=>i.id!==id); await write(()=>S.db.doc("months/"+k).set(m),"Income removed"); }
else await write(()=>S.db.doc((btn.dataset.kind==="s"?"savings/":"withdrawals/")+id).delete(),"Entry deleted");
});
}
function armDelete(btn,fn){

}

$("backdrop").addEventListener("click",e=>{ if(e.target===$("backdrop")) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("backdrop").hidden) closeSheet(); });
function dateField(id){ return '<div class="field"><label for="'+id+'">When</label><input class="input" type="datetime-local" id="'+id+'" value="'+localNow()+'"></div>'; }
function readDate(id){ const v=$(id).value; const d=v?new Date(v):new Date(); return isNaN(d)?new Date().toISOString():d.toISOString(); }
function sheetWithdraw(k,chargeId){
const c=calc(k); const r=c.rows.find(x=>x.id===chargeId); if(!r) return;
const isSave=r.type==="savings";
const chips=r.type==="envelope"?[50,100,200].filter(v=>v<=Math.max(r.left,200)):[];
openSheet(
'<h2>'+(isSave?"Move to savings":"Withdraw")+' · '+esc(r.name)+'</h2>'+
'<p class="hint">'+fmt(r.taken)+' of '+fmt(r.planned)+' '+CUR+' taken. '+fmt(r.left)+' '+CUR+' left.</p>'+
'<div class="field"><label for="w-amt">Amount ('+CUR+')</label><input class="input big-in" id="w-amt" inputmode="decimal" autocomplete="off" value="'+(r.type==="envelope"?"":(r.left||""))+'"></div>'+
'<div class="chips">'+chips.map(v=>'<button class="chip" data-chip="'+v+'">'+v+'</button>').join("")+(r.left?'<button class="chip" data-chip="'+r.left+'">All left ('+fmt(r.left)+')</button>':'')+'</div>'+
dateField("w-at")+
'<div class="field"><label for="w-note">Note (optional)</label><input class="input" id="w-note" autocomplete="off" placeholder="'+(isSave?"e.g. salary day":"e.g. second gaz top-up")+'"></div>'+
'<div class="err" id="w-err"></div>'+
'<div class="btn-row"><button class="btn '+(isSave?"save":"paid")+'" id="w-go">'+(isSave?"Move to savings":"Record withdrawal")+'</button><button class="btn ghost" data-close>Cancel</button></div>',
sh=>{
sh.querySelectorAll("[data-chip]").forEach(b=>b.addEventListener("click",()=>{ $("w-amt").value=b.dataset.chip; check(); }));
const check=()=>{ const v=num($("w-amt").value); $("w-err").textContent = v>r.left&&r.left>=0&&!isNaN(v)&&v>0 ? "That is "+fmt(v-r.left)+" "+CUR+" more than planned. You can still save it." : ""; };
$("w-amt").addEventListener("input",check);
$("w-go").addEventListener("click",async()=>{
const v=num($("w-amt").value); if(!(v>0)){ $("w-err").textContent="Enter an amount above 0."; return; }
$("w-go").disabled=true;
const at=readDate("w-at"), note=$("w-note").value.trim();
const ok = isSave
? await write(()=>S.db.collection("savings").add({month:k,chargeId:r.id,kind:"deposit",amount:v,at,reason:note||("Savings from "+monthLabel(k)+" salary"),createdAt:new Date().toISOString()}), fmt(v)+" "+CUR+" moved to savings")
: await write(()=>S.db.collection("withdrawals").add({month:k,chargeId:r.id,amount:v,at,note,createdAt:new Date().toISOString()}), fmt(v)+" "+CUR+" withdrawn for "+r.name);
if(ok) closeSheet(); else $("w-go").disabled=false;
});
});
}
function sheetUnplanned(k){
const cc=calc(k);
openSheet('<h2>Unplanned withdrawal</h2><p class="hint">For money taken out that isn’t in your plan. It comes from your spare money: '+money(Math.max(cc.spare,0))+' left.</p>'+
'<div class="field"><label for="u-amt">Amount ('+CUR+')</label><input class="input big-in" id="u-amt" inputmode="decimal" autocomplete="off"></div>'+
'<div class="field"><label for="u-note">What was it for?</label><input class="input" id="u-note" autocomplete="off" placeholder="e.g. taxi, doctor"></div>'+dateField("u-at")+
'<div class="err" id="u-err"></div><div class="btn-row"><button class="btn paid" id="u-go">Record withdrawal</button><button class="btn ghost" data-close>Cancel</button></div>',
()=>{ $("u-amt").addEventListener("input",()=>{ const v=num($("u-amt").value); $("u-err").textContent = v>0&&v>Math.max(cc.spare,0) ? "That is "+fmt(v-Math.max(cc.spare,0))+" "+CUR+" more than your spare money. It will come from your planned charges. You can still save it." : ""; });
$("u-go").addEventListener("click",async()=>{
const v=num($("u-amt").value), note=$("u-note").value.trim();
if(!(v>0)){ $("u-err").textContent="Enter an amount above 0."; return; }
if(!note){ $("u-err").textContent="Write what it was for, so you can recognise it later."; return; }
$("u-go").disabled=true;
const ok=await write(()=>S.db.collection("withdrawals").add({month:k,chargeId:null,amount:v,at:readDate("u-at"),note,createdAt:new Date().toISOString()}),"Unplanned withdrawal saved");
if(ok) closeSheet(); else $("u-go").disabled=false;
}); });
}
function sheetIncome(k){
openSheet('<h2>Extra income</h2><p class="hint">A bonus, a gift, money paid back. It adds to this month’s money in.</p>'+
'<div class="field"><label for="i-name">From</label><input class="input" id="i-name" autocomplete="off" placeholder="e.g. Work bonus"></div>'+
'<div class="field"><label for="i-amt">Amount ('+CUR+')</label><input class="input big-in" id="i-amt" inputmode="decimal" autocomplete="off"></div>'+
'<div class="err" id="i-err"></div><div class="btn-row"><button class="btn primary" id="i-go">Add income</button><button class="btn ghost" data-close>Cancel</button></div>',
()=>{ $("i-go").addEventListener("click",async()=>{
const v=num($("i-amt").value), name=$("i-name").value.trim();
if(!name){ $("i-err").textContent="Write where the money came from."; return; }
if(!(v>0)){ $("i-err").textContent="Enter an amount above 0."; return; }
$("i-go").disabled=true;
const m=clone(S.months[k]); m.income=[...(m.income||[]),{id:uid(),name,amount:v,at:new Date().toISOString()}];
const ok=await write(()=>S.db.doc("months/"+k).set(m),"Income added");
if(ok) closeSheet(); else $("i-go").disabled=false;
}); });
}
function sheetSavings(dir){
const k=currentKey(); if(!k){ toast("Set up a month first."); return; }
const out=dir==="out";
openSheet('<h2>'+(out?"Take out of savings":"Add to savings")+'</h2><p class="hint">Balance now: '+money(savingsBalance())+'.'+(out?" Money you take out is added to "+esc(monthLabel(k))+"’s money in.":"")+'</p>'+
'<div class="field"><label for="s-amt">Amount ('+CUR+')</label><input class="input big-in" id="s-amt" inputmode="decimal" autocomplete="off"></div>'+
'<div class="field"><label for="s-why">Reason</label><input class="input" id="s-why" autocomplete="off" placeholder="'+(out?"e.g. a big purchase":"e.g. leftover from last month")+'"></div>'+dateField("s-at")+
'<div class="err" id="s-err"></div><div class="btn-row"><button class="btn '+(out?"paid":"save")+'" id="s-go">'+(out?"Take out":"Add to savings")+'</button><button class="btn ghost" data-close>Cancel</button></div>',
()=>{ $("s-go").addEventListener("click",async()=>{
const v=num($("s-amt").value), why=$("s-why").value.trim();
if(!(v>0)){ $("s-err").textContent="Enter an amount above 0."; return; }
if(!why){ $("s-err").textContent="Write a reason. It keeps your savings history clear."; return; }
$("s-go").disabled=true;
const ok=await write(()=>S.db.collection("savings").add({month:k,chargeId:null,kind:out?"withdraw":"deposit",amount:out?-v:v,at:readDate("s-at"),reason:why,createdAt:new Date().toISOString()}), out?"Taken out of savings":"Added to savings");
if(ok) closeSheet(); else $("s-go").disabled=false;
}); });
}
/* plan editor (used by Edit plan and New month) */
function planEditorHtml(rows){
return '<div id="pl-rows">'+rows.map(planRowHtml).join("")+'</div><button class="btn small" id="pl-add">+ Add a charge</button>';
}
function planRowHtml(r){
return '<div class="plan-row" data-row="'+esc(r.id)+'">'+
'<input class="input" data-f="name" aria-label="Charge name" value="'+esc(r.name)+'" placeholder="Charge name">'+
'<input class="input" data-f="planned" aria-label="Amount" inputmode="decimal" value="'+esc(r.planned)+'" placeholder="0">'+
'<div class="wide"><select class="input" data-f="type" aria-label="Type">'+
'<option value="fixed"'+(r.type!=="envelope"&&r.type!=="savings"?" selected":"")+'>Withdraw at once</option>'+
'<option value="envelope"'+(r.type==="envelope"?" selected":"")+'>Envelope (withdraw in parts)</option>'+
'<option value="savings"'+(r.type==="savings"?" selected":"")+'>Goes to savings</option></select>'+
'<button class="x" data-del-row>Remove</button></div></div>';
}
function bindPlanEditor(sh, onChange){
const wire=row=>{
row.querySelector("[data-del-row]").addEventListener("click",()=>{ row.remove(); onChange&&onChange(); });
row.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",()=>onChange&&onChange()));
};
sh.querySelectorAll(".plan-row").forEach(wire);
$("pl-add").addEventListener("click",()=>{
const d=document.createElement("div"); d.innerHTML=planRowHtml({id:uid(),name:"",planned:"",type:"fixed"});
const row=d.firstChild; $("pl-rows").appendChild(row); wire(row); row.querySelector("input").focus(); onChange&&onChange();
});
}
function readPlan(){
const out=[]; let err="";
document.querySelectorAll("#pl-rows .plan-row").forEach(row=>{
const name=row.querySelector('[data-f="name"]').value.trim();
const p=num(row.querySelector('[data-f="planned"]').value||"0");
const type=row.querySelector('[data-f="type"]').value;
if(!name&&!(p>0)) return;
if(!name) err="Every charge needs a name.";
else if(isNaN(p)||p<0) err="Check the amount for "+name+".";
out.push({id:row.dataset.row,name,planned:isNaN(p)?0:p,type});
});
return {rows:out,err};
}
function sheetPlan(k){
const m=S.months[k];
openSheet('<h2>Edit plan · '+esc(monthLabel(k))+'</h2>'+
'<div class="field"><label for="p-sal">Salary ('+CUR+')</label><input class="input big-in" id="p-sal" inputmode="decimal" value="'+esc(m.salary)+'"></div>'+
planEditorHtml(m.charges||[])+'<p class="hint" id="p-tot"></p><div class="err" id="p-err"></div>'+
'<div class="btn-row"><button class="btn primary" id="p-go">Save plan</button><button class="btn ghost" data-close>Cancel</button></div>',
sh=>{
const tot=()=>{ const {rows}=readPlan(); const s=num($("p-sal").value)||0; const t=sum(rows,r=>r.planned); const inc=sum(m.income||[],i=>Number(i.amount)||0);
$("p-tot").textContent="Planned "+money(t)+" of "+money(s+inc)+" · "+(s+inc-t>=0?money(s+inc-t)+" not planned":money(t-s-inc)+" over"); };
bindPlanEditor(sh,tot); $("p-sal").addEventListener("input",tot); tot();
$("p-go").addEventListener("click",async()=>{
const {rows,err}=readPlan(); const s=num($("p-sal").value);
if(!(s>=0)){ $("p-err").textContent="Enter your salary."; return; }
if(err){ $("p-err").textContent=err; return; }
const removed=(m.charges||[]).filter(c=>!rows.some(r=>r.id===c.id));
const blocked=removed.find(c=>S.withdrawals.some(w=>w.month===k&&w.chargeId===c.id)||S.savings.some(e=>e.month===k&&e.chargeId===c.id));
if(blocked){ $("p-err").textContent=blocked.name+" has withdrawals this month. Delete them from the log first, or keep the charge."; return; }
$("p-go").disabled=true;
const nm=clone(m); nm.salary=s; nm.charges=rows;
const ok=await write(()=>S.db.doc("months/"+k).set(nm),"Plan saved");
if(ok) closeSheet(); else $("p-go").disabled=false;
});
});
}
function sheetNewMonth(){
const prevKey=currentKey();
const newKey=prevKey?addMonths(prevKey,1):(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");})();
if(S.months[newKey]){ toast(monthLabel(newKey)+" already exists."); return; }
const prev=prevKey?calc(prevKey):null;
const leftover=prev&&!prev.m.imported?Math.max(Math.round(prev.inBank*100)/100,0):0;
const rows=prev?clone(prev.m.charges||[]):[{id:"rent",name:"Rent & bills",planned:"",type:"fixed"},{id:"food",name:"Food",planned:"",type:"fixed"},{id:"savings",name:"Savings",planned:"",type:"savings"}];
const salaryOf=monthLabel(addMonths(newKey,-1));
openSheet('<h2>Start '+esc(monthLabel(newKey))+'</h2><p class="hint">Salary of '+esc(salaryOf)+'. Charges are copied from '+(prev?esc(monthLabel(prevKey)):"a starter list")+'. Change any amount.</p>'+
'<div class="field"><label for="n-sal">Salary received ('+CUR+')</label><input class="input big-in" id="n-sal" inputmode="decimal" autocomplete="off" value="'+(prev?esc(prev.m.salary):"")+'"></div>'+
(leftover>0?'<div class="field"><label>'+esc(monthLabel(prevKey))+' left '+money(leftover)+' in the bank</label>'+
'<label class="radio"><input type="radio" name="n-left" value="income" checked><span>Add it to '+esc(monthLabel(newKey))+'’s money</span></label>'+
'<label class="radio"><input type="radio" name="n-left" value="savings"><span>Move it to savings</span></label>'+
'<label class="radio"><input type="radio" name="n-left" value="none"><span>Leave it out</span></label></div>':'')+
'<h3 style="font-size:16px">Charges</h3>'+planEditorHtml(rows)+'<p class="hint" id="n-tot"></p><div class="err" id="n-err"></div>'+
'<div class="btn-row"><button class="btn primary" id="n-go">Start '+esc(monthLabel(newKey))+'</button><button class="btn ghost" data-close>Cancel</button></div>',
sh=>{
const tot=()=>{ const {rows}=readPlan(); const s=num($("n-sal").value)||0; const lo=(document.querySelector('input[name="n-left"]:checked')||{}).value==="income"?leftover:0; const t=sum(rows,r=>r.planned);
$("n-tot").textContent="Planned "+money(t)+" of "+money(s+lo)+" · "+(s+lo-t>=0?money(s+lo-t)+" not planned":money(t-s-lo)+" over"); };
bindPlanEditor(sh,tot); $("n-sal").addEventListener("input",tot); sh.querySelectorAll('input[name="n-left"]').forEach(r=>r.addEventListener("change",tot)); tot();
$("n-go").addEventListener("click",async()=>{
const {rows,err}=readPlan(); const s=num($("n-sal").value);
if(!(s>0)){ $("n-err").textContent="Enter the salary you received."; return; }
if(err){ $("n-err").textContent=err; return; }
if(!rows.length){ $("n-err").textContent="Add at least one charge."; return; }
$("n-go").disabled=true;
const choice=(document.querySelector('input[name="n-left"]:checked')||{}).value||"none";
const nm={key:newKey,salaryOf,salary:s,charges:rows,income:[],closed:false,createdAt:new Date().toISOString()};
if(leftover>0&&choice==="income") nm.income.push({id:uid(),name:"Leftover from "+monthLabel(prevKey),amount:leftover,at:new Date().toISOString()});
const ok=await write(async()=>{
await S.db.doc("months/"+newKey).set(nm);
if(leftover>0&&choice==="savings") await S.db.collection("savings").add({month:newKey,chargeId:null,kind:"deposit",fromLeftover:true,amount:leftover,at:new Date().toISOString(),reason:"Leftover from "+monthLabel(prevKey),createdAt:new Date().toISOString()});
if(prevKey){ const pm=clone(S.months[prevKey]); pm.closed=true; await S.db.doc("months/"+prevKey).set(pm); }
await S.db.doc("settings/app").set({...(S.settings||{}),currentMonth:newKey});
}, monthLabel(newKey)+" started");
if(ok){ S.viewKey=newKey; S.pendingKey=newKey; closeSheet(); location.hash="#month"; route(); window.scrollTo(0,0); } else $("n-go").disabled=false;
});
});
}
/* ---------- export ---------- */
function csvCell(v){ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
async function exportCsv(){
if(!S.dl) return;
const lines=[["type","month","date","category","amount_dh","planned_dh","note"].join(",")];
sortedKeys().forEach(k=>{ const m=S.months[k];
lines.push(["salary",k,"","Salary",m.salary,"",m.salaryOf?("Salary of "+m.salaryOf):""].map(csvCell).join(","));
(m.income||[]).forEach(i=>lines.push(["income",k,i.at||"",i.name,i.amount,"",""].map(csvCell).join(",")));
(m.charges||[]).forEach(c=>lines.push(["plan",k,"",c.name,"",c.planned,c.type].map(csvCell).join(",")));
});
[...S.withdrawals].sort((a,b)=>(a.month+(a.at||"")).localeCompare(b.month+(b.at||""))).forEach(w=>{
lines.push(["withdrawal",w.month,w.at||"",labelFor(S.months[w.month]||{},w.chargeId,w.note),w.amount,"",w.note||""].map(csvCell).join(","));
});
[...S.savings].sort((a,b)=>(a.month+(a.at||"")).localeCompare(b.month+(b.at||""))).forEach(e=>{
lines.push(["savings_"+e.kind,e.month,e.at||"","Savings",e.amount,"",e.reason||""].map(csvCell).join(","));
});
const r=await saveFile("salary-manager-"+new Date().toISOString().slice(0,10)+".csv",lines.join("\n"),"text/csv");
if(r!=="cancelled") toast("CSV ready");
}
/* ---------- backup / restore ---------- */
async function exportBackup(){
const now=new Date().toISOString();
const body=JSON.stringify({app:"salary-manager",version:1,exportedAt:now,data:LocalDB.dump()});
const r=await saveFile("salary-manager-backup-"+now.slice(0,10)+".json",body,"application/json");
if(r==="cancelled") return;
await write(()=>S.db.doc("settings/app").set({...(S.settings||{}),lastBackupAt:now}),"Backup saved");
}
function normalizeBackup(obj){
let data=null;
if(obj&&obj.app==="salary-manager"&&obj.data&&typeof obj.data==="object") data=obj.data;
else if(obj&&obj.months&&typeof obj.months==="object"){ data={}; for(const [c,docs] of Object.entries(obj)) if(docs&&typeof docs==="object") for(const [id,d] of Object.entries(docs)) data[c+"/"+id]=d; }
if(!data) return null;
const ok={}; let months=0, bal=0;
for(const [p,d] of Object.entries(data)){
const parts=p.split("/");
if(parts.length!==2||!["months","withdrawals","savings","settings"].includes(parts[0])||!d||typeof d!=="object"||Array.isArray(d)) continue;
ok[p]=d; if(parts[0]==="months") months++; if(parts[0]==="savings") bal+=Number(d.amount)||0;
}
return months?{data:ok,months,bal,exportedAt:obj.exportedAt||null}:null;
}
function sheetImport(){
openSheet('<h2>Restore a backup</h2><p class="hint">Choose a Salary Manager backup file (.json). It replaces the data on this phone.</p>'+
'<div class="field"><label for="imp-file">Backup file</label><input class="input" type="file" id="imp-file" accept=".json,application/json"></div>'+
'<div class="hint" id="imp-info"></div><div class="err" id="imp-err"></div>'+
'<div class="btn-row"><button class="btn primary" id="imp-go" disabled>Restore this backup</button><button class="btn ghost" data-close>Cancel</button></div>',
()=>{
let parsed=null;
$("imp-file").addEventListener("change",async()=>{
parsed=null; $("imp-go").disabled=true; $("imp-info").textContent=""; $("imp-err").textContent="";
const f=$("imp-file").files[0]; if(!f) return;
try{ parsed=normalizeBackup(JSON.parse(await f.text())); }catch(e){ parsed=null; }
if(!parsed){ $("imp-err").textContent="This file isn\u2019t a Salary Manager backup. Choose the .json file you saved from the app."; return; }
$("imp-info").textContent="Found "+parsed.months+" months, savings balance "+money(parsed.bal)+(parsed.exportedAt?", saved "+new Date(parsed.exportedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"")+"."+(LocalDB.isEmpty()?"":" The data now on this phone will be replaced.");
$("imp-go").disabled=false;
});
$("imp-go").addEventListener("click",()=>{
if(!parsed) return;
try{ LocalDB.replaceAll(parsed.data); S.viewKey=null; closeSheet(); toast("Backup restored"); location.hash="#month"; route(); }
catch(e){ $("imp-err").textContent="Phone storage is full. Free some space and try again."; }
});
});
}
boot();
})();
